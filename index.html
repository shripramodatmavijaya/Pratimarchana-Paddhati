<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ತಂತ್ರಸಾರೋಕ್ತ ದೇವಪೂಜಾಪದ್ಧತಿ</title>
<style>
  /* ---- dark theme (default: this is what gets projected) ---- */
  :root {
    --bg-a:        #050505;
    --bg-b:        #0a0a0a;
    --title-a:     #cc0000;
    --title-b:     #ff3333;
    --mantra-bg:   #1a0000;
    --mantra-fg:   #ff6666;
    --tantra-fg:   #dddddd;
    --meta-fg:     #b34747;
    --rule:        #3a0000;
    --btn-bg:      #140000;
    --btn-fg-on:   #ffe0e0;
    --hover-bg:    #140000;

    --fs-mantra:   4em;
    --fs-tantra:   2.8em;
    --fs-title:    3.4em;
    --fs-meta:     1.9em;
    --fs-footer:   1.5em;
    --fs-index:    1.55em;
  }

  /* ---- light theme (opt-in: dark type on warm paper) ----
     Chosen for contrast at reading distance, not for screen aesthetics:
     the mantra red is darkened to #8a1010 and the tantra text to near
     black so both stay legible on a bright screen or a printed handout. */
  :root[data-theme="light"] {
    --bg-a:        #fdfbf6;
    --bg-b:        #f1ebdf;
    --title-a:     #8b0000;
    --title-b:     #a81c1c;
    --mantra-bg:   #fdf3e7;
    --mantra-fg:   #8a1010;
    --tantra-fg:   #1c1a17;
    --meta-fg:     #7a4a42;
    --rule:        #d8c6a8;
    --btn-bg:      #fff7ec;
    --btn-fg-on:   #fff6f6;
    --hover-bg:    #f6e7d4;
  }

  /* ---- phones and short landscape windows ----
     4em is right for a projector and far too large for a handset, so the
     type scale steps down; the fit pass then fine-tunes per slide. */
  @media (max-width: 860px), (max-height: 560px) {
    :root {
      --fs-mantra: 2.15em;
      --fs-tantra: 1.45em;
      --fs-title:  1.5em;
      --fs-meta:   1.0em;
      --fs-footer: 0.95em;
      --fs-index:  1.0em;
    }
  }
  @media (max-width: 460px) {
    :root { --fs-mantra: 1.8em; --fs-tantra: 1.25em; --fs-title: 1.25em; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;                 /* strictly no scrolling, per spec */
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
    background-attachment: fixed;
    color: var(--tantra-fg);
    font-family: 'Tunga', 'Noto Sans Kannada', 'Nirmala UI',
                 'Kedage', 'Akshar Unicode', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;   /* stop iOS inflating the type */
    text-size-adjust: 100%;
    overscroll-behavior: none;        /* no pull-to-refresh / bounce */
  }

  /* Fixed rather than simply full-height: on iOS Safari and Chrome Android
     a 100vh element is taller than the visible area while the URL bar is
     showing, which pushes the footer off screen. dvh plus a fixed body
     keeps the deck exactly inside the visible viewport. */
  body {
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    touch-action: manipulation;       /* kills the double-tap zoom delay */
  }

  /* ---------------- header ---------------- */
  header {
    flex: 0 0 auto;
    padding: 1.2vh 3vw 0.8vh;
    padding-top: max(1.2vh, env(safe-area-inset-top));
    padding-left: max(3vw, env(safe-area-inset-left));
    padding-right: max(3vw, env(safe-area-inset-right));
    border-bottom: 2px solid var(--rule);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2vw;
  }

  #kriyaTitle {
    font-size: var(--fs-title);
    font-weight: 700;
    line-height: 1.25;
    background: linear-gradient(90deg, var(--title-a) 0%, var(--title-b) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 0.5vw rgba(204, 0, 0, 0.25);
  }
  @supports not (-webkit-background-clip: text) {
    #kriyaTitle { color: var(--title-b); }
  }

  #slideCount {
    flex: 0 0 auto;
    font-size: var(--fs-footer);
    color: var(--meta-fg);
    white-space: nowrap;
  }

  /* ---------------- stage ---------------- */
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    padding: 2vh 3vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2.2vh;
    overflow: hidden;
  }

  .meta {
    font-size: var(--fs-meta);
    color: var(--meta-fg);
    line-height: 1.5;
    font-style: italic;
    text-align: center;
  }

  .mantra-box {
    background: var(--mantra-bg);
    border: 2px solid var(--rule);
    border-left: 10px solid var(--title-a);
    border-radius: 6px;
    padding: 2.2vh 2.4vw;
  }

  .mantra {
    font-size: var(--fs-mantra);
    color: var(--mantra-fg);
    line-height: 1.55;
    text-align: center;
    font-weight: 600;
  }
  .mantra + .mantra { margin-top: 0.5vh; }

  .tantra {
    font-size: var(--fs-tantra);
    color: var(--tantra-fg);
    line-height: 1.5;
    text-align: center;
  }

  /* ------------- column-major grids -------------
     Entries run DOWN the first column and then down the second, so a list
     of eight reads 1-2-3-4 on the left and 5-6-7-8 on the right. The row
     count is set per grid at render time, because only then is the number
     of entries actually on that slide known. */
  .index-grid, .col-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 4vw;
    row-gap: 0.35vh;
    width: 100%;
  }
  .col-grid {
    column-gap: 3vw;
    row-gap: 0.6vh;
  }
  .mcol {
    font-size: var(--fs-mantra);
    color: var(--mantra-fg);
    line-height: 1.5;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
  }

  .ix {
    display: flex;
    align-items: baseline;
    gap: 0.6vw;
    font-family: inherit;
    font-size: var(--fs-index);
    background: none;
    border: none;
    border-bottom: 1px dotted var(--rule);
    color: var(--tantra-fg);
    text-align: left;
    padding: 0.25vh 0.2vw;
    cursor: pointer;
    width: 100%;
  }
  .ix:hover   { color: var(--title-b); background: var(--hover-bg); }
  .ix { -webkit-tap-highlight-color: transparent; }
  /* Touch targets are enlarged with em padding rather than a px min-height:
     a fixed pixel floor cannot be reduced by the font-shrink fit pass, and
     would leave index slides clipped. */
  @media (pointer: coarse) {
    .ix { padding-top: 0.45em; padding-bottom: 0.45em; }
  }
  .ix:focus-visible { outline: 2px solid var(--title-b); outline-offset: 2px; }
  .ix-num  { color: var(--meta-fg); min-width: 3.2em; flex: 0 0 auto; }
  .ix-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; }
  .ix-pg   { color: var(--title-b); flex: 0 0 auto; font-weight: 700; }
  .ix.ix-annex .ix-num { color: var(--title-a); }

  .section-head {
    font-size: calc(var(--fs-index) * 1.35);
    color: var(--title-b);
    font-weight: 700;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 0.3vh;
    margin-top: 0.6vh;
    width: 100%;
  }

  /* ---------------- annexure ---------------- */
  .annex-term {
    font-size: calc(var(--fs-mantra) * 0.72);
    color: var(--mantra-fg);
    font-weight: 700;
    text-align: center;
  }
  .annex-text {
    font-size: var(--fs-tantra);
    color: var(--tantra-fg);
    line-height: 1.55;
    text-align: left;
  }

  /* ---------------- footer ---------------- */
  footer {
    flex: 0 0 auto;
    padding: 0.9vh 3vw 1.3vh;
    padding-bottom: max(1.3vh, env(safe-area-inset-bottom));
    padding-left: max(3vw, env(safe-area-inset-left));
    padding-right: max(3vw, env(safe-area-inset-right));
    border-top: 2px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2vw;
  }

  #footNote {
    font-size: var(--fs-footer);
    color: var(--meta-fg);
    white-space: nowrap;
  }

  nav { display: flex; gap: 1.2vw; }

  button.nav {
    font-family: inherit;
    font-size: var(--fs-footer);
    padding: 0.7vh 1.8vw;
    min-height: 44px;                 /* iOS/Android minimum touch target */
    min-width: 44px;
    background: var(--btn-bg);
    color: var(--title-b);
    border: 2px solid var(--title-a);
    border-radius: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s ease, color 0.12s ease;
  }
  button.nav:hover:not(:disabled) { background: var(--title-a); color: var(--btn-fg-on); }
  button.nav:active:not(:disabled) { background: var(--title-a); color: var(--btn-fg-on); }

  /* On a narrow screen the buttons keep their glyph and drop the word. */
  .btn-label { display: inline; }
  @media (max-width: 700px) {
    .btn-label { display: none; }
    nav { gap: 2vw; }
    button.nav { padding: 0.6vh 3vw; }
  }
  button.nav:focus-visible { outline: 3px solid var(--title-b); outline-offset: 3px; }
  button.nav:disabled { opacity: 0.3; cursor: default; }

  #progress {
    position: fixed;
    left: 0; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--title-a), var(--title-b));
    width: 0;
    transition: width 0.15s ease;
    z-index: 10;
  }

  #measure {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    left: -99999px;
    top: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div id="kriyaTitle"></div>
  <div id="slideCount"></div>
</header>

<main id="stage"></main>

<footer>
  <div id="footNote"></div>
  <nav>
    <button class="nav" id="btnTheme" type="button" aria-label="ಬಣ್ಣ ಬದಲಾವಣೆ"
            title="ಬೆಳಕು / ಕತ್ತಲೆ ಶೈಲಿ (T)"><span id="themeIcon">&#9788;</span></button>
    <button class="nav" id="btnIndex" type="button" aria-label="ಅನುಕ್ರಮಣಿಕಾ"
            >&#9776;<span class="btn-label"> ಅನುಕ್ರಮಣಿಕಾ</span></button>
    <button class="nav" id="btnPrev"  type="button" aria-label="ಹಿಂದಿನದು"
            >&#8592;<span class="btn-label"> ಹಿಂದಿನದು</span></button>
    <button class="nav" id="btnNext"  type="button" aria-label="ಮುಂದಿನದು"
            ><span class="btn-label">ಮುಂದಿನದು </span>&#8594;</button>
  </nav>
</footer>

<div id="progress"></div>
<div id="measure"></div>

<script>

  else document.documentElement.removeAttribute("data-theme");
  themeIcon.innerHTML = (mode === "light") ? "&#9789;" : "&#9788;";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", mode === "light" ? "#fdfbf6" : "#050505");
  try { localStorage.setItem("pooja-theme", mode); } catch (e) { /* file:// */ }
}

function currentTheme() {
  return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
}

function toggleTheme() {
  applyTheme(currentTheme() === "light" ? "dark" : "light");
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("pooja-theme"); } catch (e) { /* file:// */ }
  applyTheme(saved === "light" ? "light" : "dark");
})();

let slides = [];
let idx = 0;
let indexStart = 0;

/* ---------------------------------------------------------------
   Unified item list: the annexure sits up front (right after the
   index) so the terms are defined before the kriyas that use them.
   Serial numbers are assigned by position within each section, so
   inserting an entry anywhere in the Python data renumbers
   everything automatically.
   --------------------------------------------------------------- */
function buildItems() {
  const items = [];
  ANNEXURE.forEach((a, i) => items.push({
    kind: "annex", num: i + 1, name: a.term,
    meta: a.ref, mantra: [], tantra: a.text
  }));
  KRIYAS.forEach((k, i) => items.push({
    kind: "kriya", num: i + 1, name: k.name,
    meta: k.meta, mantra: k.mantra, cols: k.cols, tantra: k.tantra
  }));
  return items;
}

function blocksFor(it) {
  const out = [];
  if (it.meta && it.meta.trim()) out.push({ cls: "meta", text: it.meta });
  if (it.kind === "annex") {
    out.push({ cls: "annex-term", text: it.name });
    splitSentences(it.tantra).forEach(t => out.push({ cls: "annex-text", text: t }));
    return out;
  }
  (it.mantra || []).forEach(line => {
    if (line && line.trim()) out.push({ cls: "mantra", text: line });
  });
  (it.cols || []).forEach(entry => {
    if (entry && entry.trim()) out.push({ cls: "mcol", text: entry });
  });
  if (it.tantra && it.tantra.trim()) out.push({ cls: "tantra", text: it.tantra });
  return out;
}

/* Annexure explanations are long prose; break them at sentence ends so a
   definition can span slides without cutting mid-sentence. */
function splitSentences(text) {
  const parts = text.split(/(?<=\.)\s+/);
  const out = [];
  let buf = "";
  parts.forEach(p => {
    if ((buf + " " + p).length > 220 && buf) { out.push(buf.trim()); buf = p; }
    else { buf = buf ? buf + " " + p : p; }
  });
  if (buf.trim()) out.push(buf.trim());
  return out;
}

function makeNode(b) {
  const el = document.createElement("div");
  el.className = b.cls;
  el.textContent = b.text;
  return el;
}

function makeIndexRow(b) {
  if (b.cls === "section-head") {
    const h = document.createElement("div");
    h.className = "section-head";
    h.textContent = b.text;
    return h;
  }
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "ix" + (b.annex ? " ix-annex" : "");
  const n = document.createElement("span");
  n.className = "ix-num";
  n.textContent = (b.annex ? "ಅ" : "") + b.num + ".";
  const nm = document.createElement("span");
  nm.className = "ix-name";
  nm.textContent = b.text;
  const pg = document.createElement("span");
  pg.className = "ix-pg";
  pg.textContent = b.page;
  btn.appendChild(n); btn.appendChild(nm); btn.appendChild(pg);
  btn.addEventListener("click", () => show(b.page - 1));
  return btn;
}

/* Render blocks into a container, grouping consecutive mantra lines into one
   maroon box and consecutive index rows into one grid. */
function renderInto(container, blocks) {
  container.textContent = "";
  let box = null, cgrid = null, igrid = null;
  blocks.forEach(b => {
    if (b.cls === "mantra") {
      igrid = null; cgrid = null;
      if (!box) { box = document.createElement("div"); box.className = "mantra-box"; container.appendChild(box); }
      box.appendChild(makeNode(b));
    } else if (b.cls === "mcol") {
      igrid = null;
      if (!box) { box = document.createElement("div"); box.className = "mantra-box"; container.appendChild(box); }
      if (!cgrid) { cgrid = document.createElement("div"); cgrid.className = "col-grid"; box.appendChild(cgrid); }
      cgrid.appendChild(makeNode(b));
    } else if (b.cls === "ix") {
      box = null; cgrid = null;
      if (!igrid) { igrid = document.createElement("div"); igrid.className = "index-grid"; container.appendChild(igrid); }
      igrid.appendChild(makeIndexRow(b));
    } else if (b.cls === "section-head") {
      /* a heading closes the current grid so the next section starts its
         own two columns - the sections stay visually intact */
      box = null; cgrid = null; igrid = null;
      container.appendChild(makeIndexRow(b));
    } else {
      box = null; cgrid = null; igrid = null;
      container.appendChild(makeNode(b));
    }
  });
  layoutColumns(container);
}

/* Set the row count on every grid so entries flow DOWN each column. */
function layoutColumns(root) {
  const twoCol = window.innerWidth >= window.innerHeight;
  root.querySelectorAll(".index-grid, .col-grid").forEach(g => {
    const n = g.children.length;
    if (!twoCol || n < 2) {
      g.style.gridTemplateColumns = "1fr";
      g.style.gridAutoFlow = "row";
      g.style.gridTemplateRows = "";
      return;
    }
    g.style.gridTemplateColumns = "1fr 1fr";
    g.style.gridAutoFlow = "column";
    g.style.gridTemplateRows = "repeat(" + Math.ceil(n / 2) + ", auto)";
  });
}

/* ---------------------------------------------------------------
   Greedy pagination against a measured stage box.
   --------------------------------------------------------------- */
function measureSetup() {
  const rect = stage.getBoundingClientRect();
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  measure.style.width = (rect.width - padX) + "px";
  measure.style.display = "flex";
  measure.style.flexDirection = "column";
  measure.style.gap = cs.gap;
  /* small safety margin: the hidden ruler cannot reproduce flex-shrink
     behaviour in the live stage exactly, so leave a little headroom. */
  return (rect.height - padY) - 12;
}

function packBlocks(blocks, availH) {
  const parts = [];
  let current = [];
  blocks.forEach(b => {
    const trial = current.concat([b]);
    renderInto(measure, trial);
    if (measure.scrollHeight > availH && current.length) {
      parts.push(current);
      current = [b];
    } else {
      current = trial;
    }
  });
  if (current.length) parts.push(current);
  return parts;
}

function shrinkFor(part, availH) {
  renderInto(measure, part);
  let shrink = 1;
  while (measure.scrollHeight > availH && shrink > 0.4) {
    shrink -= 0.05;
    measure.style.fontSize = (shrink * 100) + "%";
  }
  measure.style.fontSize = "";
  return shrink;
}

function paginateContent(items, availH) {
  const built = [];
  items.forEach(it => {
    const blocks = blocksFor(it);
    if (!blocks.length) {
      built.push({ item: it, blocks: [], part: 1, parts: 1, shrink: 1, kind: it.kind });
      return;
    }
    const parts = packBlocks(blocks, availH);
    parts.forEach((p, i) => built.push({
      item: it, blocks: p, part: i + 1, parts: parts.length,
      shrink: shrinkFor(p, availH), kind: it.kind
    }));
  });
  return built;
}

function paginateIndex(entries, availH) {
  const parts = packBlocks(entries, availH);
  return parts.map((p, i) => ({
    item: null, blocks: p, part: i + 1, parts: parts.length,
    shrink: shrinkFor(p, availH), kind: "index"
  }));
}

/* ---------------------------------------------------------------
   Full build. The index has to know page numbers, but adding index
   slides changes those page numbers - so iterate until stable.
   --------------------------------------------------------------- */
function buildAll() {
  const availH = measureSetup();
  const items = buildItems();
  const content = paginateContent(items, availH);

  /* first physical slide (within content) of each item */
  const firstOf = new Map();
  content.forEach((sl, i) => {
    if (sl.item && !firstOf.has(sl.item)) firstOf.set(sl.item, i);
  });

  let offset = 1, indexSlides = [];
  for (let pass = 0; pass < 6; pass++) {
    const entries = [];
    if (ANNEXURE.length) {
      entries.push({ cls: "section-head", text: "ಅನುಬಂಧ" });
      items.forEach(it => {
        if (it.kind !== "annex") return;
        entries.push({ cls: "ix", num: it.num, text: it.name,
                       page: offset + firstOf.get(it) + 1, annex: true });
      });
    }
    entries.push({ cls: "section-head", text: "ಕ್ರಿಯೆಗಳು" });
    items.forEach(it => {
      if (it.kind !== "kriya") return;
      entries.push({ cls: "ix", num: it.num, text: it.name,
                     page: offset + firstOf.get(it) + 1, annex: false });
    });
    indexSlides = paginateIndex(entries, availH);
    if (indexSlides.length === offset) break;
    offset = indexSlides.length;
  }

  measure.textContent = "";
  indexStart = 0;
  slides = indexSlides.concat(content);
  if (idx >= slides.length) idx = slides.length - 1;
  if (idx < 0) idx = 0;
}

/* ---------------------------------------------------------------
   Final guarantee. Whatever the estimate said, this measures the
   LIVE stage and steps the font down until nothing is clipped, so
   `overflow: hidden` never actually hides any text.
   --------------------------------------------------------------- */
function fitToStage(startScale) {
  let scale = startScale || 1;
  stage.style.fontSize = scale < 1 ? (scale * 100) + "%" : "";
  let guard = 0;
  while (stage.scrollHeight > stage.clientHeight && scale > 0.35 && guard < 40) {
    scale -= 0.04;
    stage.style.fontSize = (scale * 100) + "%";
    guard++;
  }
}

/* --------------------------------------------------------------- */
function show(i) {
  if (!slides.length) return;
  idx = Math.max(0, Math.min(i, slides.length - 1));
  const s = slides[idx];

  let title;
  if (s.kind === "index") {
    title = "ಅನುಕ್ರಮಣಿಕಾ";
  } else if (s.kind === "annex") {
    title = "ಅನುಬಂಧ " + s.item.num + ". " + s.item.name;
  } else {
    title = s.item.num + ". " + s.item.name;
  }
  if (s.parts > 1) title += " (ಭಾಗ " + s.part + ")";
  titleEl.textContent = title;

  renderInto(stage, s.blocks);
  fitToStage(s.shrink);

  const pageLabel = "(ಪುಟ " + (idx + 1) + ")";
  if (s.kind === "index") {
    footEl.textContent = "ಅನುಕ್ರಮಣಿಕಾ " + pageLabel;
  } else {
    footEl.textContent = (s.part < s.parts)
      ? "ಮುಂದುವರಿಯುವುದು... " + pageLabel
      : "ಮುಕ್ತಾಯ " + pageLabel;
  }

  countEl.textContent = (idx + 1) + " / " + slides.length;
  progressEl.style.width = ((idx + 1) / slides.length * 100) + "%";

  btnPrev.disabled = (idx === 0);
  btnNext.disabled = (idx === slides.length - 1);
}

function go(delta) { show(idx + delta); }

btnPrev.addEventListener("click", () => go(-1));
btnNext.addEventListener("click", () => go(1));
btnIndex.addEventListener("click", () => show(indexStart));
btnTheme.addEventListener("click", toggleTheme);

document.addEventListener("keydown", e => {
  if (e.target && e.target.classList && e.target.classList.contains("ix")
      && (e.key === "Enter" || e.key === " ")) return;
  switch (e.key) {
    case "ArrowRight": case "ArrowDown": case "PageDown": case " ":
      e.preventDefault(); go(1); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); go(-1); break;
    case "Home": e.preventDefault(); show(0); break;
    case "End":  e.preventDefault(); show(slides.length - 1); break;
    case "i": case "I": e.preventDefault(); show(indexStart); break;
    case "t": case "T": e.preventDefault(); toggleTheme(); break;
    case "f": case "F":
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
  }
});

let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  touchX = null;
}, { passive: true });

let resizeTimer = null;
let lastW = window.innerWidth, lastH = window.innerHeight;

function relayout() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const cur = slides.length ? slides[idx] : null;
    const anchorItem = cur && cur.item;
    const anchorPart = cur ? cur.part : 1;
    buildAll();
    let target = -1;
    if (anchorItem) {
      target = slides.findIndex(s => s.item && s.item.num === anchorItem.num
                                  && s.item.kind === anchorItem.kind
                                  && s.part === anchorPart);
      if (target < 0) target = slides.findIndex(s => s.item && s.item.num === anchorItem.num
                                                  && s.item.kind === anchorItem.kind);
    }
    show(target < 0 ? idx : target);
  }, 150);
}

/* Mobile browsers fire resize when the URL bar slides away, which changes
   the height by ~60px without anything really changing. Re-paginating on
   every one of those makes the deck jump under the reader's finger, so
   small height-only changes are ignored. */
window.addEventListener("resize", () => {
  const dw = Math.abs(window.innerWidth - lastW);
  const dh = Math.abs(window.innerHeight - lastH);
  if (dw < 2 && dh < 90) return;
  lastW = window.innerWidth; lastH = window.innerHeight;
  relayout();
});

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    lastW = window.innerWidth; lastH = window.innerHeight;
    relayout();
  }, 250);
});

/* Fonts change metrics, so paginate only once they have settled. */
function boot() { buildAll(); show(0); }
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(boot);
} else {
  window.addEventListener("load", boot);
}
</script>
</body>
</html>
